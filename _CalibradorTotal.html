<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calibrador Clip-Path Dinámico - Outpost 31</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #d0d8e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .coord-hud {
            width: 100%;
            max-width: 1100px;
            background: rgba(5, 11, 20, 0.95);
            border: 2px solid #0055ff;
            border-radius: 6px;
            color: #7df9ff;
            padding: 12px 20px;
            font-size: 0.95rem;
            margin-bottom: 15px;
            box-shadow: 0 5px 20px rgba(0, 85, 255, 0.3);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            z-index: 2000;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(0, 150, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
            cursor: crosshair;
            user-select: none;
            margin-bottom: 40px;
        }

        .game-image {
            width: 100%;
            display: block;
        }

        .css-box {
            background: rgba(0, 255, 100, 0.1);
            border: 1px solid rgba(0, 255, 100, 0.5);
            padding: 8px 15px;
            border-radius: 4px;
            color: #5cdb95;
            font-weight: bold;
            cursor: pointer;
            white-space: pre-wrap;
            font-size: 0.85rem;
        }
        .css-box:hover {
            background: rgba(0, 255, 100, 0.2);
        }

        .status-text {
            color: #ff7df9;
            font-weight: bold;
        }

        .reset-btn {
            background: #ff0055;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
        }
        .reset-btn:hover {
            background: #cc0044;
        }

        .click-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ff0055;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
        }

        /* Primer punto con diseño diferenciado para indicar dónde cerrar */
        .click-point.first-point {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        #polyPreview {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="coord-hud" id="coordHud">
        <div id="instructionStatus">Estado: <span class="status-text" id="stepText">Haz clic para añadir puntos. Haz clic cerca del 1º punto para cerrar.</span></div>
        <div class="css-box" id="copyBtn" title="Haz clic para copiar código CSS">#miHotspot { ... }</div>
        <button class="reset-btn" id="resetBtn">Reiniciar</button>
    </div>

    <div class="game-container" id="gameContainer">


<!-- ***********************************************************************************************************************  -->

<video src="images/sala_mapas.mp4" alt="Outpost 31" class="game-image" autoplay muted loop playsinline preload="auto"></video>


<!--         	<video src="images/sala_almacen.mp4" alt="Outpost 31" class="game-image" autoplay muted loop playsinline preload="auto"></video>

		<img src="images/sala_almacen.jpg" alt="Outpost 31" class="game-image">
 
 -->
<!-- ***********************************************************************************************************************  -->

        <svg id="polyPreview">
            <polygon id="svgPolygon" points="" fill="rgba(255, 0, 85, 0.25)" stroke="#ff0055" stroke-width="2" stroke-dasharray="4"/>
        </svg>
    </div>

    <script>
        const container = document.getElementById('gameContainer');


// ***********************************************************************************************************************  // 

const targetVideo = container.querySelector('video');  

//    const targetVideo = container.querySelector('video');     // 


//	const targetVideo = container.querySelector('img');     // 

-->

//  ***********************************************************************************************************************  // 

        const stepText = document.getElementById('stepText');
        const copyBtn = document.getElementById('copyBtn');
        const resetBtn = document.getElementById('resetBtn');
        const svgPolygon = document.getElementById('svgPolygon');

        let points = [];
        let pointElements = [];
        let isCompleted = false;

        container.addEventListener('click', (e) => {
            const rect = targetVideo.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;

            if (isCompleted) {
                // Si ya está completado, un clic extra copia el texto directamente y avisa
                copiarAlPortapapeles();
                return;
            }

            // Comprobar si se quiere cerrar el polígono haciendo clic cerca del primer punto (radio de 15px)
            if (points.length >= 3) {
                const primerPunto = points[0];
                const distancia = Math.hypot(x - primerPunto.px, y - primerPunto.py);
                if (distancia < 15) {
                    isCompleted = true;
                    stepText.innerText = "¡Forma cerrada! Haz clic en la caja verde (o en la imagen) para copiar.";
                    actualizarVisualYResultado();
                    return;
                }
            }

            const percX = (x / rect.width) * 100;
            const percY = (y / rect.height) * 100;

            points.push({ x: percX, y: percY, px: x, py: y });

            const dot = document.createElement('div');
            dot.className = points.length === 1 ? 'click-point first-point' : 'click-point';
            dot.style.left = x + 'px';
            dot.style.top = y + 'px';
            container.appendChild(dot);
            pointElements.push(dot);

            actualizarVisualYResultado();

            if (points.length === 1) {
                stepText.innerText = "Punto 1 fijado. Sigue añadiendo puntos o haz clic cerca del 1º para cerrar.";
            } else {
                stepText.innerText = `Puntos: ${points.length}. Haz clic cerca del punto turquesa para cerrar la figura.`;
            }
        });

        function actualizarVisualYResultado() {
            if (points.length === 0) {
                svgPolygon.setAttribute('points', '');
                copyBtn.innerText = `#miHotspot { ... }`;
                return;
            }

            const ptsStr = points.map(p => `${p.px},${p.py}`).join(' ');
            svgPolygon.setAttribute('points', ptsStr);

            const minX = Math.min(...points.map(p => p.x));
            const maxX = Math.max(...points.map(p => p.x));
            const minY = Math.min(...points.map(p => p.y));
            const maxY = Math.max(...points.map(p => p.y));

            const top = minY;
            const left = minX;
            const width = Math.max(maxX - minX, 1);
            const height = Math.max(maxY - minY, 1);

            const polyCoords = points.map(p => {
                const relX = ((p.x - left) / width) * 100;
                const relY = ((p.y - top) / height) * 100;
                return `${Math.round(relX)}% ${Math.round(relY)}%`;
            }).join(', ');

            const cssGenerado = `#miHotspot {
    top: ${Math.round(top)}%;
    left: ${Math.round(left)}%;
    width: ${Math.round(width)}%;
    height: ${Math.round(height)}%;
    clip-path: polygon(${polyCoords});
}`;

            copyBtn.innerText = cssGenerado;
        }

        function copiarAlPortapapeles() {
            if (points.length < 3) return;
            const textoACopiar = copyBtn.innerText;
            navigator.clipboard.writeText(textoACopiar).then(() => {
                const temp = stepText.innerText;
                stepText.innerText = "¡Copiado con éxito al portapapeles!";
                setTimeout(() => { stepText.innerText = temp; }, 1800);
            });
        }

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            points = [];
            pointElements.forEach(el => el.remove());
            pointElements = [];
            isCompleted = false;
            svgPolygon.setAttribute('points', '');
            stepText.innerText = "Haz clic para añadir puntos. Haz clic cerca del 1º punto para cerrar.";
            copyBtn.innerText = `#miHotspot { ... }`;
        });

        copyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            copiarAlPortapapeles();
        });
    </script>
</body>
</html>
