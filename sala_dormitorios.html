<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeping Quarters - U.S. Outpost 31</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #d0d8e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(0, 150, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        .game-image {
            width: 100%;
            display: block;
        }

        .hotspot {
            position: absolute;
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .hotspot:hover {
            background-color: rgba(0, 220, 255, 0.5);
            border: none;
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.8);
        }

        /* Coordenadas adaptadas para los elementos del dormitorio */

#lampara {
    top: 51%;
    left: 82%;
    width: 13%;
    height: 27%;
    clip-path: polygon(0% 71%, 56% 100%, 97% 97%, 100% 10%, 17% 0%, 2% 28%);
}

        #radioSpot {
    top: 65%;
    left: 6%;
    width: 9%;
    height: 12%;
    clip-path: polygon(100% 77%, 98% 14%, 80% 0%, 0% 16%, 4% 92%, 21% 100%);
}

        #parkaSpot {
    top: 55%;
    left: 72%;
    width: 9%;
    height: 17%;
    clip-path: polygon(0% 6%, 62% 0%, 100% 18%, 99% 96%, 29% 100%, 3% 78%);
}

        #literasSpot {
    top: 60%;
    left: 18%;
    width: 23%;
    height: 30%;
    clip-path: polygon(11% 100%, 72% 100%, 100% 36%, 98% 20%, 87% 20%, 88% 3%, 43% 0%, 38% 17%, 27% 14%, 0% 40%, 8% 42%);
}

        #ventanaSpot {
    top: 32%;
    left: 46%;
    width: 10%;
    height: 17%;
    clip-path: polygon(1% 0%, 99% 0%, 100% 100%, 0% 99%);
}

        /* Controles de la radio situados justo debajo del hotspot de la radio */
        #radioControls {
            display: none;
            position: absolute;
            top: 77%;
            left: 6%;
            background: rgba(5, 11, 20, 0.9);
            border: 1px solid #0055ff;
            padding: 5px 8px;
            border-radius: 4px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(0, 85, 255, 0.4);
        }

        #radioControls input[type="range"] {
            width: 70px;
            accent-color: #00f0ff;
            cursor: pointer;
        }

        .radio-close-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 3px;
            width: 18px;
            height: 18px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .radio-close-btn:hover {
            background: #b02a37;
        }

        .player-hud {
            position: fixed;
            top: 15px;
            right: 20px;
            background: rgba(5, 11, 20, 0.95);
            border: 1px solid #0055ff;
            color: #00f0ff;
            padding: 8px 15px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            z-index: 1500;
            box-shadow: 0 0 12px rgba(0, 85, 255, 0.4);
            border-radius: 2px;
            font-family: 'Share Tech Mono', monospace;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #141a24;
            border: 1px solid #2a3b55;
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 25px rgba(0,120,255,0.2);
            position: relative;
            text-align: left;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #4da6ff;
            font-size: 1.2rem;
            border-bottom: 1px solid #22304a;
            padding-bottom: 10px;
            text-align: center;
        }

        .modal-content p {
            line-height: 1.6;
            color: #b8c7e0;
            font-size: 0.95rem;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #7a92b8;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: #fff;
        }

        .drawer-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 6px;
            border: 1px solid #0080ff;
            cursor: pointer;
        }

        .drawer-btn {
            background-color: #0080ff;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .drawer-btn:hover {
            background-color: #0066cc;
        }

        .code-input {
            background-color: #0b0f19;
            border: 1px solid #2a3b55;
            color: #7df9ff;
            padding: 10px;
            font-size: 1.1rem;
            text-align: center;
            width: 80%;
            border-radius: 4px;
            font-family: 'Share TechMono', monospace;
            letter-spacing: 3px;
            margin: 10px auto;
            display: block;
        }

        #fullscreenViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            cursor: pointer;
            justify-content: center;
            align-items: center;
        }

        #fullscreenViewer img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .back-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: #141a24;
            color: #4da6ff;
            border: 1px solid #2a3b55;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            z-index: 1500;
        }

        #timerContainer {
            position: fixed;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, #0d131f 0%, #162235 100%);
            color: #7df9ff;
            border: 2px solid #2e4a70;
            box-shadow: inset 0 0 10px rgba(0, 180, 255, 0.2), 0 0 12px rgba(0, 150, 255, 0.3);
            padding: 8px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 6px;
            z-index: 1500;
            text-shadow: 0 0 6px rgba(125, 249, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="player-hud" id="playerHud">IDENTIDAD: CARGANDO...</div>

    <div id="timerContainer">EST: <span id="countdown">00:10</span></div>
    <a href="#" id="backBtn" class="back-btn" onclick="playClick(); volverAlMapa(event)">VOLVER AL MAPA</a>

    <div class="game-container" id="gameContainer">
        <video src="images/sala_dormitorios.mp4" alt="Sleeping Quarters - Outpost 31" class="game-image" autoplay muted loop playsinline preload="auto"></video>

        <!-- Hotspots -->
        <div class="hotspot" id="radioSpot" onclick="playClick(); interactuarRadio()"></div>
        <div class="hotspot" id="parkaSpot" onclick="playClick(); revisarTarjeta()"></div>
        <div class="hotspot" id="literasSpot" onclick="playClick(); openModal('Literas', 'Camas de hierro oscuras cubiertas por una gruesa capa de escarcha y mantas rígidas por el frío.')"></div>
        <div class="hotspot" id="ventanaSpot" onclick="playClick(); openModal('Ventana Exterior', 'A través del cristal empañado y helado se divisa la tormenta y un helicóptero aparcado fuera.')"></div>
        <div class="hotspot" id="lampara" onclick="playClick(); openModal('Lámpara', 'Bla.')"></div>

        <!-- Controles de la radio (botón de apagado y barra de volumen) -->
        <div id="radioControls" style="display: none;">
            <input type="range" id="volumeRange" min="0" max="1" step="0.05" value="0.5" oninput="cambiarVolumenRadio(this.value)">
            <button class="radio-close-btn" onclick="playClick(); apagarRadio()">&times;</button>
        </div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="playClick(); closeModal()">&times;</button>
            <h3 id="modalTitle">Título</h3>
            <div id="modalBody">
                <p id="modalText">Texto...</p>
            </div>
        </div>
    </div>

    <div id="fullscreenViewer" onclick="playClick(); closeFullscreen()">
        <img id="fullscreenImg" src="" alt="Pantalla completa">
    </div>

    <script>
        const SCRIPT_INVENTARIO_URL = "https://script.google.com/macros/s/AKfycbyxoSM32MKedAamrgglimkF6W9-q0MrB-N1BmLL5WH6pKvLO2mDcz4aeCxCRm78OZaFcA/exec";
        const SCRIPT_LOCALIZACIONES_URL = "https://script.google.com/macros/s/AKfycbw_XBJaqPoyMa0YeebEsrcoqXTMoIqIy4DGvSi9PulBb9YG2YD055wIbRa_yMyFUVJG/exec";

        let jugadorActual = "JUGADOR";

        function actualizarIdentidadJugador() {
            const urlParams = new URLSearchParams(window.location.search);
            const jugadorUrl = urlParams.get('jugador');
            if (jugadorUrl && jugadorUrl.trim() !== "") {
                jugadorActual = jugadorUrl.trim();
                localStorage.setItem('jugador_activo_global', jugadorActual);
            } else {
                const jugadorGuardado = localStorage.getItem('jugador_activo_global');
                if (jugadorGuardado) jugadorActual = jugadorGuardado;
            }
            document.getElementById('playerHud').innerText = `IDENTIDAD: ${jugadorActual.toUpperCase()}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            actualizarIdentidadJugador();
        });

        function playClick() {
            const clickAudio = new Audio('audio/click.mp3');
            clickAudio.play().catch(e => console.log("Audio error:", e));
        }

        // --- LÓGICA DE LA RADIO ---
        let currentRadioAudio = null;
        let radioVolumenActual = 0.5;
        let cancionesDisponibles = [];
        const totalCanciones = 5;

        function interactuarRadio() {
            document.getElementById('radioControls').style.display = 'flex';
            reproducirCancionAleatoriaRadio(true);
        }

        function reproducirCancionAleatoriaRadio(esPrimerInicio = false) {
            if (currentRadioAudio) {
                currentRadioAudio.pause();
                currentRadioAudio = null;
            }

            // Si ya han sonado todas, rellenamos de nuevo el array con las 5 canciones
            if (cancionesDisponibles.length === 0) {
                for (let i = 1; i <= totalCanciones; i++) {
                    cancionesDisponibles.push(i);
                }
            }

            // Sacar una canción al azar de las disponibles y eliminarla para que no se repita
            const indiceAleatorio = Math.floor(Math.random() * cancionesDisponibles.length);
            const numeroRandom = cancionesDisponibles.splice(indiceAleatorio, 1)[0];

            const rutaCancion = `audio/song${numeroRandom}.mp3`;

            currentRadioAudio = new Audio(rutaCancion);
            currentRadioAudio.volume = radioVolumenActual;

            if (esPrimerInicio) {
                // Si se pincha por primera vez, empieza en un momento avanzado
                currentRadioAudio.addEventListener('loadedmetadata', () => {
                    const tiempoInicioRandom = Math.random() * (currentRadioAudio.duration * 0.4) + (currentRadioAudio.duration * 0.1);
                    currentRadioAudio.currentTime = tiempoInicioRandom;
                    currentRadioAudio.play().catch(e => console.log("Error al reproducir audio de radio:", e));
                });
            } else {
                // Si es por reproducción automática al terminar la anterior, suena desde el principio
                currentRadioAudio.play().catch(e => console.log("Error al reproducir audio de radio:", e));
            }

            // Cuando termine la canción actual, salta a otra al azar desde el principio sin repetir hasta agotar la lista
            currentRadioAudio.addEventListener('ended', () => {
                reproducirCancionAleatoriaRadio(false);
            });
        }

        function cambiarVolumenRadio(valor) {
            radioVolumenActual = parseFloat(valor);
            if (currentRadioAudio) {
                currentRadioAudio.volume = radioVolumenActual;
            }
        }

        function apagarRadio() {
            if (currentRadioAudio) {
                currentRadioAudio.pause();
                currentRadioAudio = null;
            }
            document.getElementById('radioControls').style.display = 'none';
        }

        // --- LÓGICA PARA ENCONTRAR LA TARJETA ---
        function revisarTarjeta() {
            const nombreObjeto = "parka";
            const tituloModal = "Casillero";
            const imagenSrc = "images/parka.jpg";
            const descripcionEncontrado = "Rebuscas entre las pertenencias abandonadas y encuentras una parka «Big Red». Se trata de un abrigo rojo de alta resistencia diseñado para soportar temperaturas extremas.";

            document.getElementById('modalTitle').innerText = tituloModal;
            document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #4da6ff;">Revisando la zona...</p>`;
            document.getElementById('gameModal').style.display = 'flex';

            fetch(SCRIPT_LOCALIZACIONES_URL + `?action=getStatus&item=${encodeURIComponent(nombreObjeto)}`)
                .then(async response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    if (data.disponible === false) {
                        document.getElementById('modalBody').innerHTML = `<p>El área ya ha sido registrada minuciosamente y no queda nada de valor.</p>`;
                    } else {
                        solicitarCodigoTarjeta(nombreObjeto, imagenSrc, descripcionEncontrado);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById('modalBody').innerHTML = `<p style="color: #dc3545; text-align: center;">Error al comprobar el objeto.</p>`;
                });
        }

        function solicitarCodigoTarjeta(nombreObjeto, imagenSrc, descripcionEncontrado) {
            document.getElementById('modalBody').innerHTML = `
                <p style="text-align: center; color: #4da6ff;">Introduce tu código de acceso personal:</p>
                <input type="text" id="personalCodeInput" class="code-input" maxlength="4" placeholder="----" autocomplete="off">
                <div style="text-align: center; margin-top: 20px;">
                    <button class="drawer-btn" onclick="playClick(); validarCodigoTarjeta('${nombreObjeto}', '${imagenSrc}', '${descripcionEncontrado}')">Comprobar Código</button>
                </div>
            `;
        }

        function validarCodigoTarjeta(nombreObjeto, imagenSrc, descripcionEncontrado) {
            const codigo = document.getElementById('personalCodeInput').value.trim();
            let jugadorIdentificado = "";
            let costePA = 1;

            if (codigo === "1245") {
                jugadorIdentificado = "jugador1";
            } else if (codigo === "2356") {
                jugadorIdentificado = "jugador2";
            } else {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #dc3545;">Código incorrecto o sin permisos.</p>`;
                return;
            }

            jugadorActual = jugadorIdentificado;
            document.getElementById('playerHud').innerText = `IDENTIDAD: ${jugadorActual.toUpperCase()}`;

            document.getElementById('modalBody').innerHTML = `
                <p>${descripcionEncontrado}</p>
                <img src="${imagenSrc}" alt="Parka" class="drawer-img" onclick="playClick(); showFullscreenImage('${imagenSrc}')">
                <p style="margin-top: 15px; text-align: center; color: #4da6ff;">¿Deseas coger el abrigo? (Coste: ${costePA} PA).</p>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                    <button class="drawer-btn" style="background-color: #28a745;" onclick="playClick(); procesarRecogidaObjeto('${nombreObjeto}', ${costePA})">Sí, coger</button>
                    <button class="drawer-btn" style="background-color: #dc3545;" onclick="playClick(); closeModal()">No, dejar</button>
                </div>
            `;
        }

        function procesarRecogidaObjeto(nombreObjeto, costePA) {
            document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #4da6ff;">Guardando objeto...</p>`;

            fetch(SCRIPT_INVENTARIO_URL + `?action=verificarYProcesarObjeto&jugador=${encodeURIComponent(jugadorActual)}&item=${encodeURIComponent(nombreObjeto)}&coste=${costePA}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const pickupAudio = new Audio('audio/pickup.mp3');
                        pickupAudio.play().catch(e => console.log("Audio error:", e));

                        fetch(SCRIPT_LOCALIZACIONES_URL + `?action=updateStatus&item=${encodeURIComponent(nombreObjeto)}`);

                        document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #5cdb95;">¡Parka añadida a tu inventario!</p>`;
                    } else {
                        document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #dc3545;">No tienes suficientes Puntos de Acción.</p>`;
                    }
                })
                .catch(() => {
                    document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #dc3545;">Error de conexión.</p>`;
                });
        }

        let timeLeft = 10;
        const countdownEl = document.getElementById('countdown');
        const timerContainerEl = document.getElementById('timerContainer');
        const backBtnEl = document.getElementById('backBtn');

        const timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                let formattedTime = "00:" + (timeLeft < 10 ? "0" : "") + timeLeft;
                countdownEl.innerText = formattedTime;
            }
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                const clingAudio = new Audio('audio/cling.mp3');
                clingAudio.play().catch(e => console.log("Audio error:", e));
                timerContainerEl.style.display = 'none';
                backBtnEl.style.display = 'block';
            }
        }, 1000);

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `<p id="modalText">${text}</p>`;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

        function showFullscreenImage(src) {
            const viewer = document.getElementById('fullscreenViewer');
            document.getElementById('fullscreenImg').src = src;
            viewer.style.display = 'flex';
        }

        function closeFullscreen() {
            document.getElementById('fullscreenViewer').style.display = 'none';
        }

        function volverAlMapa(event) {
            event.preventDefault();
            const doorAudio = new Audio('audio/opendoor.mp3');
            doorAudio.play().catch(e => console.log("Audio error:", e));
            setTimeout(() => {
                window.location.href = `mapa.html?jugador=${encodeURIComponent(jugadorActual)}`;
            }, 1500);
        }
    </script>
</body>
</html>
