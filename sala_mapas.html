<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Mapas - U.S. Outpost 31</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #d0d8e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000000;
            cursor: none;
        }

        .game-image {
            width: 100%;
            display: block;
        }

        /* --- CAPA DE OSCURIDAD / EFECTO LINTERNA --- */
        #flashlightOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
		background: rgba(0,0,0,0.50);
  /*            background: #000000;      */
            pointer-events: none;
            z-index: 50;
        }

        .hotspot {
            position: absolute;
            background-color: transparent; /* Completamente invisible por defecto */
            border: none;                   /* Sin ningún tipo de borde o filo */
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
            z-index: 60;
        }

        .hotspot:hover {
            background-color: rgba(0, 220, 255, 0.5); /* Se ilumina con un tono brillante al pasar el ratón */
            border: none;                             /* Nos aseguramos de que siga sin mostrar bordes */
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.8); /* Efecto de brillo interior intenso */
        }

#wallMap {
    top: 0%;
    left: 24%;
    width: 14%;
    height: 32%;
    clip-path: polygon(25% 0%, 92% 11%, 100% 92%, 20% 100%, 0% 1%);
}

#leftShelf {
    top: 41%;
    left: 44%;
    width: 7%;
    height: 8%;
    clip-path: polygon(4% 25%, 38% 0%, 100% 12%, 98% 77%, 65% 100%, 0% 79%);
}

#rightShelves {
    top: 38%;
    left: 88%;
    width: 11%;
    height: 12%;
    clip-path: polygon(6% 0%, 100% 7%, 78% 100%, 0% 86%);
}

#logBook {
    top: 59%;
    left: 13%;
    width: 17%;
    height: 19%;
    clip-path: polygon(33% 9%, 100% 0%, 88% 86%, 0% 100%);
}

#papersRight {
    top: 52%;
    left: 70%;
    width: 12%;
    height: 9%;
    clip-path: polygon(0% 0%, 34% 94%, 100% 100%, 56% 4%);
}

#mapTable {
    top: 50%;
    left: 64%;
    width: 3%;
    height: 6%;
    clip-path: polygon(0% 70%, 14% 30%, 51% 0%, 97% 33%, 100% 83%, 57% 100%);
}

#compass {
    top: 48%;
    left: 39%;
    width: 8%;
    height: 10%;
    clip-path: ellipse(50% 50% at 50% 50%);
}

        .player-hud {
            position: fixed;
            top: 15px;
            right: 20px;
            background: rgba(5, 11, 20, 0.95);
            border: 1px solid #0055ff;
            color: #00f0ff;
            padding: 8px 15px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            z-index: 1500;
            box-shadow: 0 0 12px rgba(0, 85, 255, 0.4);
            border-radius: 2px;
            font-family: 'Share Tech Mono', monospace;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #141a24;
            border: 1px solid #2a3b55;
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 25px rgba(0,120,255,0.2);
            position: relative;
            text-align: left;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #4da6ff;
            font-size: 1.2rem;
            border-bottom: 1px solid #22304a;
            padding-bottom: 10px;
            text-align: center;
        }

        .modal-content p {
            line-height: 1.6;
            color: #b8c7e0;
            font-size: 0.95rem;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #7a92b8;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: #fff;
        }

        .drawer-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 6px;
            border: 1px solid #0080ff;
            cursor: pointer;
        }

        .drawer-btn {
            background-color: #0080ff;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .drawer-btn:hover {
            background-color: #0066cc;
        }

        .code-input {
            background-color: #0b0f19;
            border: 1px solid #2a3b55;
            color: #7df9ff;
            padding: 10px;
            font-size: 1.1rem;
            text-align: center;
            width: 80%;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 3px;
            margin: 10px auto;
            display: block;
        }

        #fullscreenViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            cursor: pointer;
            justify-content: center;
            align-items: center;
        }

        #fullscreenViewer img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .back-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: #141a24;
            color: #4da6ff;
            border: 1px solid #2a3b55;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            z-index: 1500;
        }

        #timerContainer {
            position: fixed;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, #0d131f 0%, #162235 100%);
            color: #7df9ff;
            border: 2px solid #2e4a70;
            box-shadow: inset 0 0 10px rgba(0, 180, 255, 0.2), 0 0 12px rgba(0, 150, 255, 0.3);
            padding: 8px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 6px;
            z-index: 1500;
            text-shadow: 0 0 6px rgba(125, 249, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="player-hud" id="playerHud">IDENTIDAD: CARGANDO...</div>

    <div id="timerContainer">EST: <span id="countdown">00:10</span></div>
    <a href="#" id="backBtn" class="back-btn" onclick="playClick(); volverAlMapa(event)">VOLVER AL MAPA</a>

    <div class="game-container" id="gameContainer">
        <video src="images/sala_mapas.mp4" alt="Sala de Mapas - Outpost 31" class="game-image" autoplay muted loop playsinline preload="auto"></video>

        <div class="hotspot" id="wallMap" onclick="playClick(); openModal('Mapa de pared', 'Un viejo mapa de la Antártida clavado en la pared, con la ubicación del Outpost 31 marcada a mano.')"></div>
        <div class="hotspot" id="leftShelf" onclick="playClick(); openModal('Estantería de campo', 'Rollos de mapas topográficos y cuadernos de campo apilados, cubiertos de escarcha.')"></div>
        <div class="hotspot" id="rightShelves" onclick="playClick(); openModal('Estanterías de suministros', 'Cajas etiquetadas: GEOLOGÍA, RESERVA ANTÁRTICA, SUMINISTROS OUTPOST 31.')"></div>
        <div class="hotspot" id="logBook" onclick="playClick(); openModal('Cuaderno de bitácora', 'El registro de la estación. Las últimas páginas están manchadas y son difíciles de leer.')"></div>
        <div class="hotspot" id="papersRight" onclick="playClick(); openModal('Documentos e instrumental', 'Informes sueltos, un cuchillo y un tintero junto a un montón de papeles ordenados.')"></div>
        <div class="hotspot" id="mapTable" onclick="playClick(); openModal('Mesa de mapas', 'El mapa principal extendido sobre la mesa: OUTPOST 31, 75°S 120°W. Se señalan la plataforma de hielo Ross y el glaciar Beardmore.')"></div>
        <div class="hotspot" id="compass" onclick="playClick(); revisarObjetoXXX()"></div>

        <div id="flashlightOverlay"></div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="playClick(); closeModal()">&times;</button>
            <h3 id="modalTitle">Título</h3>
            <div id="modalBody">
                <p id="modalText">Texto...</p>
            </div>
        </div>
    </div>

    <div id="fullscreenViewer" onclick="playClick(); closeFullscreen()">
        <img id="fullscreenImg" src="" alt="Pantalla completa">
    </div>

    <script>
        // --- URLs DE LOS GOOGLE APPS SCRIPTS ---
        const SCRIPT_INVENTARIO_URL = "https://script.google.com/macros/s/AKfycbyxoSM32MKedAamrgglimkF6W9-q0MrB-N1BmLL5WH6pKvLO2mDcz4aeCxCRm78OZaFcA/exec";
        const SCRIPT_LOCALIZACIONES_URL = "https://script.google.com/macros/s/AKfycbw_XBJaqPoyMa0YeebEsrcoqXTMoIqIy4DGvSi9PulBb9YG2YD055wIbRa_yMyFUVJG/exec";

        let jugadorActual = "JUGADOR";

        function actualizarIdentidadJugador() {
            const urlParams = new URLSearchParams(window.location.search);
            const jugadorUrl = urlParams.get('jugador');

            if (jugadorUrl && jugadorUrl.trim() !== "") {
                jugadorActual = jugadorUrl.trim();
                localStorage.setItem('jugador_activo_global', jugadorActual);
            } else {
                const jugadorGuardado = localStorage.getItem('jugador_activo_global');
                if (jugadorGuardado && jugadorGuardado.trim() !== "") {
                    jugadorActual = jugadorGuardado;
                } else {
                    try {
                        if (window.parent && window.parent !== window) {
                            const parentNameElem = window.parent.document.getElementById('char-name');
                            if (parentNameElem) {
                                const textoPadre = parentNameElem.innerText.trim();
                                if (textoPadre !== "" && textoPadre !== "Cargando...") {
                                    jugadorActual = textoPadre;
                                    localStorage.setItem('jugador_activo_global', jugadorActual);
                                }
                            }
                        }
                    } catch (e) {}
                }
            }

            document.getElementById('playerHud').innerText = `IDENTIDAD: ${jugadorActual.toUpperCase()}`;
            localStorage.setItem('jugador_nombre_real', jugadorActual);
        }

        window.addEventListener('DOMContentLoaded', () => {
            actualizarIdentidadJugador();
        });

        function playClick() {
            const clickAudio = new Audio('audio/click.mp3');
            clickAudio.play().catch(e => console.log("Audio error:", e));
        }

        let timeLeft = 10;
        const countdownEl = document.getElementById('countdown');
        const timerContainerEl = document.getElementById('timerContainer');
        const backBtnEl = document.getElementById('backBtn');

        const timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                let formattedTime = "00:" + (timeLeft < 10 ? "0" : "") + timeLeft;
                countdownEl.innerText = formattedTime;
            }
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                const clingAudio = new Audio('audio/cling.mp3');
                clingAudio.play().catch(e => console.log("Audio error:", e));
                timerContainerEl.style.display = 'none';
                backBtnEl.style.display = 'block';
            }
        }, 1000);

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `<p id="modalText">${text}</p>`;
            document.getElementById('gameModal').style.display = 'flex';
        }

        // --- RUTINA ESPECÍFICA PARA EL OBJETO (objetoXXX) ---
        // Cambia "objetoXXX" y las rutas/textos de abajo cuando quieras asignar el objeto definitivo.
        function revisarObjetoXXX() {
            const nombreObjeto = "objetoXXX";
            const tituloModal = "Mesa de mapas";
            const imagenSrc = "images/objetoXXX.jpg";
            const descripcionEncontrado = "Entre los papeles y la escarcha, tus dedos rozan un objeto que alguien dejó sobre la mesa.";

            document.getElementById('modalTitle').innerText = tituloModal;
            document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #4da6ff;">Registrando la mesa...</p>`;
            document.getElementById('gameModal').style.display = 'flex';

            fetch(SCRIPT_LOCALIZACIONES_URL + `?action=getStatus&item=${encodeURIComponent(nombreObjeto)}`)
                .then(async response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const text = await response.text();
                    try { return JSON.parse(text); }
                    catch (e) { throw new Error("El servidor no devolvió un JSON válido."); }
                })
                .then(data => {
                    if (data.disponible === false) {
                        document.getElementById('modalBody').innerHTML = `<p>Está todo revuelto. No hay nada de interés aquí.</p>`;
                    } else {
                        solicitarCodigoObjetoXXX(nombreObjeto, imagenSrc, descripcionEncontrado);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById('modalBody').innerHTML = `<p style="color: #dc3545; text-align: center;">Error de conexión con el servidor.</p>`;
                });
        }

        function solicitarCodigoObjetoXXX(nombreObjeto, imagenSrc, descripcionEncontrado) {
            document.getElementById('modalBody').innerHTML = `
                <p style="text-align: center; color: #4da6ff;">Introduce tu CAP (código de acceso personal):</p>
                <input type="text" id="personalCodeInput" class="code-input" maxlength="4" placeholder="----" autocomplete="off" autocapitalize="off" spellcheck="false" data-form-type="other">
                <div style="text-align: center; margin-top: 20px;">
                    <button class="drawer-btn" onclick="playClick(); validarCodigoObjetoXXX('${nombreObjeto}', '${imagenSrc}', '${descripcionEncontrado}')">Comprobar Código</button>
                </div>
            `;
        }

        function validarCodigoObjetoXXX(nombreObjeto, imagenSrc, descripcionEncontrado) {
            const codigo = document.getElementById('personalCodeInput').value.trim();

            if (codigo === "hola") {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Acceso restringido para este código.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                    </div>
                `;
                return;
            }

            let jugadorIdentificado = "";
            let costePA = 0;

            if (codigo === "9999") {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Acceso denegado: No tienes permitido registrar esta habitación.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Cerrar</button>
                    </div>
                `;
                return;
            } else if (codigo === "1245") {
                jugadorIdentificado = "jugador1";
                costePA = 1;
            } else if (codigo === "2356") {
                jugadorIdentificado = "jugador2";
                costePA = 2;
            } else if (codigo === "3691") {
                jugadorIdentificado = "jugador3";
                costePA = 2;
            } else if (codigo === "4826") {
                jugadorIdentificado = "jugador4";
                costePA = 1;
            } else {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Código incorrecto. Acceso denegado.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Cerrar</button>
                    </div>
                `;
                return;
            }

            jugadorActual = jugadorIdentificado;
            document.getElementById('playerHud').innerText = `IDENTIDAD: ${jugadorActual.toUpperCase()}`;
            localStorage.setItem('jugador_activo_global', jugadorActual);
            localStorage.setItem('jugador_nombre_real', jugadorActual);

            let nombreBonitoObjeto = nombreObjeto.charAt(0).toUpperCase() + nombreObjeto.slice(1);
            document.getElementById('modalBody').innerHTML = `
                <p>${descripcionEncontrado}</p>
                <img src="${imagenSrc}" alt="${nombreBonitoObjeto}" class="drawer-img" onclick="playClick(); showFullscreenImage('${imagenSrc}')">
                <p style="margin-top: 15px; text-align: center; color: #4da6ff;">¿Deseas coger el objeto? (Coste: ${costePA} Puntos de Acción).</p>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                    <button class="drawer-btn" style="background-color: #28a745;" onclick="playClick(); procesarRecogidaObjeto('${nombreObjeto}', ${costePA})">Sí, coger</button>
                    <button class="drawer-btn" style="background-color: #dc3545;" onclick="playClick(); closeModal()">No, dejar</button>
                </div>
            `;
        }

        function procesarRecogidaObjeto(nombreObjeto, costePA) {
            document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #4da6ff;">Actualizando Puntos de Acción del ${jugadorActual}...</p>`;

            fetch(SCRIPT_INVENTARIO_URL + `?action=verificarYProcesarObjeto&jugador=${encodeURIComponent(jugadorActual)}&item=${encodeURIComponent(nombreObjeto)}&coste=${costePA}`)
                .then(async response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const text = await response.text();
                    try { return JSON.parse(text); }
                    catch (e) { throw new Error("El servidor no devolvió un JSON válido."); }
                })
                .then(data => {
                    if (data.suficientesAcciones === false) {
                        const nopeAudio = new Audio('audio/nope.mp3');
                        nopeAudio.play().catch(e => console.log("Audio error:", e));
                        document.getElementById('modalBody').innerHTML = `
                            <p style="text-align: center; color: #dc3545;">No tienes suficientes Puntos de Acción. Requieres ${costePA} PA para esta tarea.</p>
                            <div style="text-align: center; margin-top: 20px;">
                                <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                            </div>
                        `;
                    } else if (data.success) {
                        const pickupAudio = new Audio('audio/pickup.mp3');
                        pickupAudio.play().catch(e => console.log("Audio error:", e));

                        fetch(SCRIPT_LOCALIZACIONES_URL + `?action=updateStatus&item=${encodeURIComponent(nombreObjeto)}`)
                            .then(response => response.json())
                            .catch(err => console.error("Error al actualizar localizaciones:", err));

                        document.getElementById('modalBody').innerHTML = `
                            <p style="text-align: center; color: #5cdb95;">Acción completada. Tienes el objeto en tu inventario.</p>
                            <div style="text-align: center; margin-top: 20px;">
                                <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                            </div>
                        `;
                    } else {
                        document.getElementById('modalBody').innerHTML = `
                            <p style="text-align: center; color: #dc3545;">Error al actualizar la base de datos central.</p>
                            <div style="text-align: center; margin-top: 20px;">
                                <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error("Error de red:", error);
                    document.getElementById('modalBody').innerHTML = `
                        <p style="text-align: center; color: #dc3545;">Error de conexión con el servidor.</p>
                        <div style="text-align: center; margin-top: 20px;">
                            <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                        </div>
                    `;
                });
        }

        function showFullscreenImage(src) {
            const viewer = document.getElementById('fullscreenViewer');
            const img = document.getElementById('fullscreenImg');
            img.src = src;
            viewer.style.display = 'flex';
        }

        function closeFullscreen() {
            document.getElementById('fullscreenViewer').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

        function volverAlMapa(event) {
            event.preventDefault();
            const doorAudio = new Audio('audio/opendoor.mp3');
            doorAudio.play().catch(e => console.log("Audio error:", e));
            setTimeout(() => {
                window.location.href = `mapa.html?jugador=${encodeURIComponent(jugadorActual)}`;
            }, 1500);
        }

        // --- EFECTO LINTERNA ---
        // Radio del círculo iluminado (en px, sobre el ancho real del contenedor)
        const RADIO_LINTERNA = 130;

        const gameContainer = document.getElementById('gameContainer');
        const flashlightOverlay = document.getElementById('flashlightOverlay');

        function moverLinterna(e) {
            const rect = gameContainer.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            flashlightOverlay.style.background =
                `radial-gradient(circle ${RADIO_LINTERNA}px at ${x}px ${y}px, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.999) 100%)`;
        }

        function apagarLinterna() {
            flashlightOverlay.style.background = '#000000';
        }

        gameContainer.addEventListener('mousemove', moverLinterna);
        gameContainer.addEventListener('mouseenter', moverLinterna);
        gameContainer.addEventListener('mouseleave', apagarLinterna);

        // Soporte táctil básico (mueve la linterna al arrastrar el dedo)
        gameContainer.addEventListener('touchmove', (e) => {
            if (e.touches && e.touches[0]) {
                const rect = gameContainer.getBoundingClientRect();
                const x = e.touches[0].clientX - rect.left;
                const y = e.touches[0].clientY - rect.top;
                flashlightOverlay.style.background =
                    `radial-gradient(circle ${RADIO_LINTERNA}px at ${x}px ${y}px, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 55%, rgba(0,0,0,0.999) 100%)`;
            }
        }, { passive: true });
    </script>
</body>
</html>
