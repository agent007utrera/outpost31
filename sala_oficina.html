<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Common Office - U.S. Outpost 31</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #d0d8e8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(0, 150, 255, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        .game-image {
            width: 100%;
            display: block;
        }

.hotspot {
            position: absolute;
            background-color: transparent; /* Completamente invisible por defecto */
            border: none;                   /* Sin ningún tipo de borde o filo */
            cursor: pointer;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .hotspot:hover {
            background-color: rgba(0, 220, 255, 0.5); /* Se ilumina con un tono brillante al pasar el ratón */
            border: none;                             /* Nos aseguramos de que siga sin mostrar bordes */
            box-shadow: inset 0 0 20px rgba(0, 255, 255, 0.8); /* Efecto de brillo interior intenso */
        }

#radioPanel {
    top: 13%;
    left: 0%;
    width: 20%;
    height: 39%;
    clip-path: polygon(1% 0%, 98% 24%, 100% 88%, 0% 100%);
}

#mainDesk {
    top: 49%;
    left: 84%;
    width: 10%;
    height: 15%;
    clip-path: polygon(5% 0%, 100% 8%, 92% 100%, 0% 86%);
}

#bulletin {
    top: 29%;
    left: 62%;
    width: 12%;
    height: 16%;
    clip-path: polygon(1% 1%, 100% 0%, 95% 100%, 0% 97%);
}

#bulletin2 {
    top: 18%;
    left: 87%;
    width: 13%;
    height: 32%;
    clip-path: polygon(9% 16%, 100% 0%, 93% 100%, 0% 93%);
}

#leftDesk {
    top: 59%;
    left: 0%;
    width: 36%;
    height: 29%;
    clip-path: polygon(0% 97%, 38% 100%, 100% 12%, 99% 7%, 59% 0%, 1% 49%);
}


        #filesDesk    { top: 43%; left: 47%; width: 10%; height: 7%; }
        #gasolinaSpot { top: 70%; left: 40%; width: 12%; height: 20%; }

        .player-hud {
            position: fixed;
            top: 15px;
            right: 20px;
            background: rgba(5, 11, 20, 0.95);
            border: 1px solid #0055ff;
            color: #00f0ff;
            padding: 8px 15px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            z-index: 1500;
            box-shadow: 0 0 12px rgba(0, 85, 255, 0.4);
            border-radius: 2px;
            font-family: 'Share Tech Mono', monospace;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #141a24;
            border: 1px solid #2a3b55;
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 25px rgba(0,120,255,0.2);
            position: relative;
            text-align: left;
        }

        .modal-content h3 {
            margin-top: 0;
            color: #4da6ff;
            font-size: 1.2rem;
            border-bottom: 1px solid #22304a;
            padding-bottom: 10px;
            text-align: center;
        }

        .modal-content p {
            line-height: 1.6;
            color: #b8c7e0;
            font-size: 0.95rem;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            color: #7a92b8;
            cursor: pointer;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: #fff;
        }

        #terminalModal {
            z-index: 2500;
        }

        #terminalModal .modal-content {
            width: 96vw;
            height: 94vh;
            max-width: 1200px;
            max-height: 800px;
            padding: 0;
            background-color: #050b05;
            border: 20px solid #1a1a1a;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #terminalModal .close-btn {
            position: fixed;
            top: 25px;
            right: 35px;
            z-index: 2600;
            color: #33ff33;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(51, 255, 51, 0.5);
            background: #0a220a;
            border: 1px solid #33ff33;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        #terminalModal .close-btn:hover {
            background: #33ff33;
            color: #000;
            box-shadow: 0 0 15px #33ff33;
        }

        .drawer-img {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 6px;
            border: 1px solid #0080ff;
            cursor: pointer;
        }

        .drawer-btn {
            background-color: #0080ff;
            color: #fff;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .drawer-btn:hover {
            background-color: #0066cc;
        }

        .code-input {
            background-color: #0b0f19;
            border: 1px solid #2a3b55;
            color: #7df9ff;
            padding: 10px;
            font-size: 1.1rem;
            text-align: center;
            width: 80%;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 3px;
            margin: 10px auto;
            display: block;
        }

        #fullscreenViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 3000;
            cursor: pointer;
            justify-content: center;
            align-items: center;
        }

        #fullscreenViewer img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .back-btn {
            display: none;
            position: fixed;
            top: 15px;
            left: 15px;
            background-color: #141a24;
            color: #4da6ff;
            border: 1px solid #2a3b55;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            z-index: 1500;
        }

        #timerContainer {
            position: fixed;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, #0d131f 0%, #162235 100%);
            color: #7df9ff;
            border: 2px solid #2e4a70;
            box-shadow: inset 0 0 10px rgba(0, 180, 255, 0.2), 0 0 12px rgba(0, 150, 255, 0.3);
            padding: 8px 14px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 6px;
            z-index: 1500;
            text-shadow: 0 0 6px rgba(125, 249, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="player-hud" id="playerHud">IDENTIDAD: CARGANDO...</div>

    <div id="timerContainer">EST: <span id="countdown">00:10</span></div>
    <a href="#" id="backBtn" class="back-btn" onclick="playClick(); volverAlMapa(event)">VOLVER AL MAPA</a>

    <div class="game-container" id="gameContainer">
<video src="images/sala_oficina.mp4" alt="Common Office - Outpost 31" class="game-image" autoplay muted loop playsinline preload="auto"></video>

        <div class="hotspot" id="radioPanel" onclick="playClick(); openRadioModal()"></div>
        <div class="hotspot" id="mainDesk" onclick="playClick(); openTerminalModal()"></div>
        <div class="hotspot" id="bulletin" onclick="playClick(); openModal('Pizarra de anuncios', 'Notas y comunicados antiguos de la estación.')"></div>
        <div class="hotspot" id="bulletin2" onclick="playClick(); openModal('Pizarra de anuncios', 'Notas y comunicados antiguos de la estación.')"></div>
        <div class="hotspot" id="filesDesk" onclick="playClick(); openModal('Archivadores', 'Carpetas llenas de informes geológicos destruidos por la humedad.')"></div>
        <div class="hotspot" id="leftDesk" onclick="playClick(); revisarLinterna()"></div>
        <div class="hotspot" id="gasolinaSpot" onclick="playClick(); revisarGasolina()"></div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="playClick(); closeModal()">&times;</button>
            <h3 id="modalTitle">Título</h3>
            <div id="modalBody">
                <p id="modalText">Texto...</p>
            </div>
        </div>
    </div>

    <div id="terminalModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="playClick(); closeTerminalModal()">&times;</button>
            <iframe id="terminalFrame" src="" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>
    </div>

    <div id="fullscreenViewer" onclick="playClick(); closeFullscreen()">
        <img id="fullscreenImg" src="" alt="Pantalla completa">
    </div>

    <script>
        // --- URLs DE LES GOOGLE APPS SCRIPTS ---
        const SCRIPT_INVENTARIO_URL = "https://script.google.com/macros/s/AKfycbyxoSM32MKedAamrgglimkF6W9-q0MrB-N1BmLL5WH6pKvLO2mDcz4aeCxCRm78OZaFcA/exec";
        const SCRIPT_LOCALIZACIONES_URL = "https://script.google.com/macros/s/AKfycbw_XBJaqPoyMa0YeebEsrcoqXTMoIqIy4DGvSi9PulBb9YG2YD055wIbRa_yMyFUVJG/exec";

        let jugadorActual = "JUGADOR";

        function actualizarIdentidadJugador() {
            const urlParams = new URLSearchParams(window.location.search);
            const jugadorUrl = urlParams.get('jugador');

            if (jugadorUrl && jugadorUrl.trim() !== "") {
                jugadorActual = jugadorUrl.trim();
                localStorage.setItem('jugador_activo_global', jugadorActual);
            } else {
                const jugadorGuardado = localStorage.getItem('jugador_activo_global');
                if (jugadorGuardado && jugadorGuardado.trim() !== "") {
                    jugadorActual = jugadorGuardado;
                } else {
                    try {
                        if (window.parent && window.parent !== window) {
                            const parentNameElem = window.parent.document.getElementById('char-name');
                            if (parentNameElem) {
                                const textoPadre = parentNameElem.innerText.trim();
                                if (textoPadre !== "" && textoPadre !== "Cargando...") {
                                    jugadorActual = textoPadre;
                                    localStorage.setItem('jugador_activo_global', jugadorActual);
                                }
                            }
                        }
                    } catch (e) {}
                }
            }

            document.getElementById('playerHud').innerText = `IDENTIDAD: ${jugadorActual.toUpperCase()}`;
            localStorage.setItem('jugador_nombre_real', jugadorActual);
        }

        window.addEventListener('DOMContentLoaded', () => {
            actualizarIdentidadJugador();
        });

        function playClick() {
            const clickAudio = new Audio('audio/click.mp3');
            clickAudio.play().catch(e => console.log("Audio error:", e));
        }

        let timeLeft = 10;
        const countdownEl = document.getElementById('countdown');
        const timerContainerEl = document.getElementById('timerContainer');
        const backBtnEl = document.getElementById('backBtn');

        const timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                let formattedTime = "00:" + (timeLeft < 10 ? "0" : "") + timeLeft;
                countdownEl.innerText = formattedTime;
            }
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                const clingAudio = new Audio('audio/cling.mp3');
                clingAudio.play().catch(e => console.log("Audio error:", e));
                timerContainerEl.style.display = 'none';
                backBtnEl.style.display = 'block';
            }
        }, 1000);

        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = `<p id="modalText">${text}</p>`;
            document.getElementById('gameModal').style.display = 'flex';
        }

        function openTerminalModal() {
            const iframe = document.getElementById('terminalFrame');
            if (!iframe.src || iframe.src === "" || iframe.src === window.location.href) {
                iframe.src = 'terminal.html';
            }
            document.getElementById('terminalModal').style.display = 'flex';
        }

        function closeTerminalModal() {
            document.getElementById('terminalModal').style.display = 'none';
        }

        function openRadioModal() {
            openModal('Panel de Radio', 'Los equipos están completamente congelados y desmantelados.');
        }

        // --- RUTINA ESPECÍFICA PARA LA LINTERNA ---
        function revisarLinterna() {
            const nombreObjeto = "linterna";
            const tituloModal = "Escritorio";
            const imagenSrc = "images/linterna.jpg";
            const descripcionEncontrado = "Al retirar una gruesa capa de escarcha descubres una linterna táctica de emergencia.";

            document.getElementById('modalTitle').innerText = tituloModal;
            document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #4da6ff;">Registrando la mesa...</p>`;
            document.getElementById('gameModal').style.display = 'flex';

            fetch(SCRIPT_LOCALIZACIONES_URL + `?action=getStatus&item=${encodeURIComponent(nombreObjeto)}`)
                .then(async response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const text = await response.text();
                    try { return JSON.parse(text); } 
                    catch (e) { throw new Error("El servidor no devolvió un JSON válido."); }
                })
                .then(data => {
                    if (data.disponible === false) {
                        document.getElementById('modalBody').innerHTML = `<p>Está todo revuelto. No hay nada de interés aquí.</p>`;
                    } else {
                        solicitarCodigoLinterna(nombreObjeto, imagenSrc, descripcionEncontrado);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById('modalBody').innerHTML = `<p style="color: #dc3545; text-align: center;">Error de conexión con el servidor.</p>`;
                });
        }

        function solicitarCodigoLinterna(nombreObjeto, imagenSrc, descripcionEncontrado) {
            document.getElementById('modalBody').innerHTML = `
                <p style="text-align: center; color: #4da6ff;">Introduce tu CAP (código de acceso personal):</p>
                <input type="text" id="personalCodeInput" class="code-input" maxlength="4" placeholder="----" autocomplete="off" autocapitalize="off" spellcheck="false" data-form-type="other">
                <div style="text-align: center; margin-top: 20px;">
                    <button class="drawer-btn" onclick="playClick(); validarCodigoLinterna('${nombreObjeto}', '${imagenSrc}', '${descripcionEncontrado}')">Comprobar Código</button>
                </div>
            `;
        }

        function validarCodigoLinterna(nombreObjeto, imagenSrc, descripcionEncontrado) {
            const codigo = document.getElementById('personalCodeInput').value.trim();

            if (codigo === "hola") {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Acceso restringido para este código.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                    </div>
                `;
                return;
            }

            let jugadorIdentificado = "";
            let costePA = 0;

            if (codigo === "9999") {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Acceso denegado: No tienes permitido registrar esta habitación.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Cerrar</button>
                    </div>
                `;
                return;
            } else if (codigo === "1245") {
                jugadorIdentificado = "jugador1";
                costePA = 1;
            } else if (codigo === "2356") {
                jugadorIdentificado = "jugador2";
                costePA = 2;
            } else if (codigo === "3691") {
                jugadorIdentificado = "jugador3";
                // jugador3 no puede conseguirlo porque es de su habitación o no permitido
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Acceso denegado: No te está permitido coger este objeto.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Cerrar</button>
                    </div>
                `;
                return;
            } else if (codigo === "4826") {
                jugadorIdentificado = "jugador4";
                costePA = 2;
            } else {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Código incorrecto. Acceso denegado.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Cerrar</button>
                    </div>
                `;
                return;
            }

            jugadorActual = jugadorIdentificado;
            document.getElementById('playerHud').innerText = `IDENTIDAD: ${jugadorActual.toUpperCase()}`;
            localStorage.setItem('jugador_activo_global', jugadorActual);
            localStorage.setItem('jugador_nombre_real', jugadorActual);

            let nombreBonitoObjeto = nombreObjeto.charAt(0).toUpperCase() + nombreObjeto.slice(1);
            document.getElementById('modalBody').innerHTML = `
                <p>${descripcionEncontrado}</p>
                <img src="${imagenSrc}" alt="${nombreBonitoObjeto}" class="drawer-img" onclick="playClick(); showFullscreenImage('${imagenSrc}')">
                <p style="margin-top: 15px; text-align: center; color: #4da6ff;">¿Deseas coger la linterna? (Coste: ${costePA} Puntos de Acción).</p>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                    <button class="drawer-btn" style="background-color: #28a745;" onclick="playClick(); procesarRecogidaObjeto('${nombreObjeto}', ${costePA})">Sí, coger</button>
                    <button class="drawer-btn" style="background-color: #dc3545;" onclick="playClick(); closeModal()">No, dejar</button>
                </div>
            `;
        }

        // --- RUTINA ESPECÍFICA PARA LA GASOLINA ---
        function revisarGasolina() {
            const nombreObjeto = "gasolina";
            const tituloModal = "Depósito de Gasolina";
            const imagenSrc = "images/gasolina.jpg";
            const descripcionEncontrado = "Te aproximas con cautela al rincón. Verificas el precinto del bidón de combustible: está intacto, pesado y listo para alimentar los generadores de emergencia.";

            document.getElementById('modalTitle').innerText = tituloModal;
            document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #4da6ff;">Analizando estado del bidón...</p>`;
            document.getElementById('gameModal').style.display = 'flex';

            fetch(SCRIPT_LOCALIZACIONES_URL + `?action=getStatus&item=${encodeURIComponent(nombreObjeto)}`)
                .then(async response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const text = await response.text();
                    try { return JSON.parse(text); } 
                    catch (e) { throw new Error("El servidor no devolvió un JSON válido."); }
                })
                .then(data => {
                    if (data.disponible === false) {
                        document.getElementById('modalBody').innerHTML = `<p>El suelo está mojado y huele levemente a queroseno residual, pero el bidón principal ya ha desaparecido.</p>`;
                    } else {
                        solicitarCodigoGasolina(nombreObjeto, imagenSrc, descripcionEncontrado);
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById('modalBody').innerHTML = `<p style="color: #dc3545; text-align: center;">Error de conexión con el servidor.</p>`;
                });
        }

        function solicitarCodigoGasolina(nombreObjeto, imagenSrc, descripcionEncontrado) {
            document.getElementById('modalBody').innerHTML = `
                <p style="text-align: center; color: #4da6ff;">Introduce tu código de acceso personal:</p>
                <input type="text" id="personalCodeInput" class="code-input" maxlength="4" placeholder="----" autocomplete="off" autocapitalize="off" spellcheck="false" data-form-type="other">
                <div style="text-align: center; margin-top: 20px;">
                    <button class="drawer-btn" onclick="playClick(); validarCodigoGasolina('${nombreObjeto}', '${imagenSrc}', '${descripcionEncontrado}')">Comprobar Código</button>
                </div>
            `;
        }

        function validarCodigoGasolina(nombreObjeto, imagenSrc, descripcionEncontrado) {
            const codigo = document.getElementById('personalCodeInput').value.trim();

            if (codigo === "hola") {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Acceso restringido para este código.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                    </div>
                `;
                return;
            }

            let jugadorIdentificado = "";
            let costePA = 0;

            if (codigo === "9999") {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Acceso denegado: No tienes permitido registrar esta habitación.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Cerrar</button>
                    </div>
                `;
                return;
            } else if (codigo === "1245") {
                jugadorIdentificado = "jugador1";
                costePA = 3;
            } else if (codigo === "2356") {
                jugadorIdentificado = "jugador2";
                costePA = 4;
            } else if (codigo === "3691") {
                jugadorIdentificado = "jugador3";
                costePA = 2;
            } else if (codigo === "4826") {
                jugadorIdentificado = "jugador4";
                // jugador4 no puede conseguirlo
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Acceso denegado: Este objeto no se puede conseguir desde tu ubicación.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Cerrar</button>
                    </div>
                `;
                return;
            } else {
                const nopeAudio = new Audio('audio/nope.mp3');
                nopeAudio.play().catch(e => console.log("Audio error:", e));
                document.getElementById('modalBody').innerHTML = `
                    <p style="text-align: center; color: #dc3545;">Código incorrecto. Acceso denegado.</p>
                    <div style="text-align: center; margin-top: 20px;">
                        <button class="drawer-btn" onclick="playClick(); closeModal()">Cerrar</button>
                    </div>
                `;
                return;
            }

            jugadorActual = jugadorIdentificado;
            document.getElementById('playerHud').innerText = `IDENTIDAD: ${jugadorActual.toUpperCase()}`;
            localStorage.setItem('jugador_activo_global', jugadorActual);
            localStorage.setItem('jugador_nombre_real', jugadorActual);

            let nombreBonitoObjeto = nombreObjeto.charAt(0).toUpperCase() + nombreObjeto.slice(1);
            document.getElementById('modalBody').innerHTML = `
                <p>${descripcionEncontrado}</p>
                <img src="${imagenSrc}" alt="${nombreBonitoObjeto}" class="drawer-img" onclick="playClick(); showFullscreenImage('${imagenSrc}')">
                <p style="margin-top: 15px; text-align: center; color: #4da6ff;">¿Deseas coger la gasolina? (Coste: ${costePA} Puntos de Acción).</p>
                <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
                    <button class="drawer-btn" style="background-color: #28a745;" onclick="playClick(); procesarRecogidaObjeto('${nombreObjeto}', ${costePA})">Sí, coger</button>
                    <button class="drawer-btn" style="background-color: #dc3545;" onclick="playClick(); closeModal()">No, dejar</button>
                </div>
            `;
        }

        function procesarRecogidaObjeto(nombreObjeto, costePA) {
            document.getElementById('modalBody').innerHTML = `<p style="text-align: center; color: #4da6ff;">Actualizando Puntos de Acción del ${jugadorActual}...</p>`;

            fetch(SCRIPT_INVENTARIO_URL + `?action=verificarYProcesarObjeto&jugador=${encodeURIComponent(jugadorActual)}&item=${encodeURIComponent(nombreObjeto)}&coste=${costePA}`)
                .then(async response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const text = await response.text();
                    try { return JSON.parse(text); } 
                    catch (e) { throw new Error("El servidor no devolvió un JSON válido."); }
                })
                .then(data => {
                    if (data.suficientesAcciones === false) {
                        const nopeAudio = new Audio('audio/nope.mp3');
                        nopeAudio.play().catch(e => console.log("Audio error:", e));
                        document.getElementById('modalBody').innerHTML = `
                            <p style="text-align: center; color: #dc3545;">No tienes suficientes Puntos de Acción. Requieres ${costePA} PA para esta tarea.</p>
                            <div style="text-align: center; margin-top: 20px;">
                                <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                            </div>
                        `;
                    } else if (data.success) {
                        const pickupAudio = new Audio('audio/pickup.mp3');
                        pickupAudio.play().catch(e => console.log("Audio error:", e));

                        fetch(SCRIPT_LOCALIZACIONES_URL + `?action=updateStatus&item=${encodeURIComponent(nombreObjeto)}`)
                            .then(response => response.json())
                            .catch(err => console.error("Error al actualizar localizaciones:", err));

                        document.getElementById('modalBody').innerHTML = `
                            <p style="text-align: center; color: #5cdb95;">Acción completada. Tienes el objeto en tu inventario.</p>
                            <div style="text-align: center; margin-top: 20px;">
                                <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                            </div>
                        `;
                    } else {
                        document.getElementById('modalBody').innerHTML = `
                            <p style="text-align: center; color: #dc3545;">Error al actualizar la base de datos central.</p>
                            <div style="text-align: center; margin-top: 20px;">
                                <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error("Error de red:", error);
                    document.getElementById('modalBody').innerHTML = `
                        <p style="text-align: center; color: #dc3545;">Error de conexión con el servidor.</p>
                        <div style="text-align: center; margin-top: 20px;">
                            <button class="drawer-btn" onclick="playClick(); closeModal()">Continuar</button>
                        </div>
                    `;
                });
        }

        function showFullscreenImage(src) {
            const viewer = document.getElementById('fullscreenViewer');
            const img = document.getElementById('fullscreenImg');
            img.src = src;
            viewer.style.display = 'flex';
        }

        function closeFullscreen() {
            document.getElementById('fullscreenViewer').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }

            event.preventDefault();
            const doorAudio = new Audio('audio/opendoor.mp3');
            doorAudio.play().catch(e => console.log("Audio error:", e));
            setTimeout(() => {
